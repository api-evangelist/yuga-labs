description: 'Yuga Labs is a Web3 company and the creator of the Bored Ape Yacht Club (BAYC),
  Mutant Ape Yacht Club (MAYC), and the Otherside metaverse, along with related NFT collections
  and intellectual property. Backed by a16z, Bond Capital, GV, Lightspeed Venture Partners and
  SV Angel, the company operates in the crypto / NFT sector on the Ethereum blockchain. It does
  not publish a formal, documented public developer API program; its on-chain assets are accessed
  via Ethereum smart contracts and third-party marketplaces (OpenSea, Blur), and Otherside exposes
  the forthcoming Otherside Development Kit (ODK) for building within the metaverse. This profile
  was added to the API Evangelist network as a portfolio lead and enriched with the available
  public identity and domain-security signals.'
